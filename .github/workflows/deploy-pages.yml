name: Build GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - 'index.html'
      - '404.html'
      - 'favicon.svg'
      - 'manifest.webmanifest'
      - '.nojekyll'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-root
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
        run: |
          # Secrets vacíos pisan .env.production en Vite; solo exportar si hay valor.
          if [ -n "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            export VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
            export VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          fi
          npm run build

      - name: Sync to root + docs
        run: npm run pages:sync

      - name: Commit published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html assets favicon.svg manifest.webmanifest .nojekyll docs
          if git diff --staged --quiet; then
            echo "No site changes"
          else
            git commit -m "chore: publish site for GitHub Pages"
            git push
          fi
